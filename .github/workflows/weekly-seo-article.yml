name: Weekly SEO article publication

on:
  schedule:
    # 08:15 Helsinki in winter, 09:15 in summer. GitHub cron uses UTC.
    - cron: "15 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: weekly-seo-article
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    if: github.repository == 'dataanalyst94/elira-living' && (github.event_name == 'workflow_dispatch' || vars.SEO_AUTOMATION_ENABLED == 'true')
    env:
      GSC_SITE_URL: sc-domain:eliraliving.com
      GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
      SEO_DATA_URL: ${{ secrets.SEO_DATA_URL }}
      SEO_DATA_TOKEN: ${{ secrets.SEO_DATA_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
      SEO_MODEL: ${{ vars.SEO_MODEL || 'openai/gpt-5.1' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate evidence-led article
        id: article
        env:
          SEO_SUMMARY_PATH: ${{ runner.temp }}/weekly-seo-summary.md
        run: node tools/weekly-seo-article.mjs

      - name: Validate site build
        run: node build.js

      - name: Publish article to main
        id: publish
        shell: bash
        env:
          ARTICLE_TITLE: ${{ steps.article.outputs.title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish weekly SEO article: $ARTICLE_TITLE"
          git push origin HEAD:main
          echo "url=https://www.eliraliving.com/en/blog/${{ steps.article.outputs.slug }}.html" >> "$GITHUB_OUTPUT"

      - name: Telegram publication notice
        if: steps.publish.outputs.url != '' && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        shell: bash
        env:
          ARTICLE_TITLE: ${{ steps.article.outputs.title }}
          ARTICLE_QUERY: ${{ steps.article.outputs.query }}
          ARTICLE_URL: ${{ steps.publish.outputs.url }}
        run: |
          text=$(printf 'ELIRA WEEKLY ARTICLE PUBLISHED\n\nTitle: %s\nSearch opportunity: %s\n\nArticle: %s' \
            "$ARTICLE_TITLE" "$ARTICLE_QUERY" "$ARTICLE_URL")
          curl --fail --silent --show-error \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$text" \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage"

      - name: Telegram failure notice
        if: failure() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        shell: bash
        run: |
          text='ELIRA WEEKLY ARTICLE FAILED. Nothing was published. Open GitHub Actions to review the error.'
          curl --fail --silent --show-error \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$text" \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage"
