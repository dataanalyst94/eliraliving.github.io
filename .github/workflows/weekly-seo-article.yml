name: Weekly SEO article proposal

on:
  schedule:
    # 08:15 Helsinki in winter, 09:15 in summer. GitHub cron uses UTC.
    - cron: "15 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-seo-article
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    if: github.repository == 'dataanalyst94/elira-living' && (github.event_name == 'workflow_dispatch' || vars.SEO_AUTOMATION_ENABLED == 'true')
    env:
      GSC_SITE_URL: sc-domain:eliraliving.com
      GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
      SEO_MODEL: ${{ vars.SEO_MODEL || 'openai/gpt-5.1' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Stop when an earlier weekly article still awaits review
        id: pending
        shell: bash
        run: |
          count=$(gh pr list --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("seo/weekly-"))] | length')
          if [ "$count" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "A weekly SEO article PR is already open; skipping this run."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate evidence-led article
        if: steps.pending.outputs.skip != 'true'
        id: article
        env:
          SEO_SUMMARY_PATH: ${{ runner.temp }}/weekly-seo-summary.md
        run: node tools/weekly-seo-article.mjs

      - name: Validate site build
        if: steps.pending.outputs.skip != 'true'
        run: node build.js

      - name: Create review branch and pull request
        if: steps.pending.outputs.skip != 'true'
        id: pr
        shell: bash
        env:
          SUMMARY: ${{ runner.temp }}/weekly-seo-summary.md
          ARTICLE_TITLE: ${{ steps.article.outputs.title }}
        run: |
          branch="seo/weekly-$(date -u +%F)-${{ steps.article.outputs.slug }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "assets/data/blog/${{ steps.article.outputs.slug }}.json" assets/data/seo-topic-ledger.json
          git commit -m "Propose weekly SEO article: $ARTICLE_TITLE"
          git push origin "$branch"
          url=$(gh pr create --base main --head "$branch" --title "SEO article: $ARTICLE_TITLE" --body-file "$SUMMARY")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Telegram review notice
        if: steps.pr.outputs.url != '' && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        shell: bash
        env:
          ARTICLE_TITLE: ${{ steps.article.outputs.title }}
          ARTICLE_QUERY: ${{ steps.article.outputs.query }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          text=$(printf 'ELIRA WEEKLY ARTICLE READY\n\nTitle: %s\nSearch query: %s\n\nReview and approve: %s' \
            "$ARTICLE_TITLE" "$ARTICLE_QUERY" "$PR_URL")
          curl --fail --silent --show-error \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$text" \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage"

      - name: Telegram failure notice
        if: failure() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        shell: bash
        run: |
          text='ELIRA WEEKLY ARTICLE FAILED. Open GitHub Actions to review the error.'
          curl --fail --silent --show-error \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$text" \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage"
