name: Generate EU storefront localizations

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/localize-storefront.yml'
      - 'tools/generate-storefront-locales.mjs'
      - 'assets/data/faq-content.js'
      - 'build.js'

permissions:
  contents: write

concurrency:
  group: localize-storefront
  cancel-in-progress: false

jobs:
  localize:
    runs-on: ubuntu-latest
    if: github.repository == 'dataanalyst94/elira-living'
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      LOCALE_MODEL: ${{ vars.SEO_MODEL || 'openai/gpt-5.1' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate and validate French, Italian and Czech source
        run: node tools/generate-storefront-locales.mjs

      - name: Preserve localized source and sync with main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/content/fr.js assets/content/it.js assets/content/cs.js
          git add assets/data/blog-ui-extra.json assets/data/faq-locales-extra.json
          if ! git diff --cached --quiet; then
            git commit -m "Generate French, Italian and Czech storefront source"
          fi
          git fetch origin main
          git rebase origin/main

      - name: Build localized site and Merchant feeds
        run: |
          node build.js
          node tools/validate-merchant-feeds.mjs

      - name: Publish localized storefronts
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Add French, Italian and Czech storefronts"
          fi
          git push origin HEAD:main
